name: Astra Linux — Qt5 compatibility and DEB

on:
  workflow_call:
  pull_request:
    paths:
      - 'linux/**'
      - '.github/workflows/astra-*.yml'
      - 'Sources/RemoteAI/Resources/Mascot/**'
  push:
    branches: [main]
    paths:
      - 'linux/**'
      - '.github/workflows/astra-*.yml'
      - 'Sources/RemoteAI/Resources/Mascot/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: "DEB compatibility ${{ matrix.target }} (NOT native Astra)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian10
            image: debian:buster
          - target: debian12
            image: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: "Build/test/package in Debian compatibility container"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/astra-out"
          docker run --rm \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/src,readonly \
            --mount type=bind,source="$RUNNER_TEMP/astra-out",target=/out \
            "${{ matrix.image }}" \
            bash /src/linux/ci/build-deb.sh "${{ matrix.target }}"
      - name: "Upload DEB + SHA256 compatibility preview"
        uses: actions/upload-artifact@v4
        with:
          name: remote-ai-astra-${{ matrix.target }}-compat-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/astra-out/*.deb
            ${{ runner.temp }}/astra-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
