name: Apply polished mascot v2

on:
  push:
    branches:
      - feat/polished-mascot-v2
    paths:
      - tools/generate-polished-mascot.py
      - .github/workflows/apply-polished-mascot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and patch canonical mascot
        run: python3 tools/generate-polished-mascot.py --apply

      - name: Commit generated runtime assets
        run: |
          rm .github/workflows/apply-polished-mascot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: install polished pixel-cloud mascot v2"
          git push
