name: macOS CI — проверка

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Проверка macOS
    runs-on: macos-latest
    env:
      CI_APP_VERSION: "0.2.3"
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Версия toolchain
        run: swift --version

      - name: Проверка release workflow и скрипта настройки подписи
        shell: bash
        run: |
          bash -n tools/configure-apple-signing.sh
          bash -n tools/release-policy.sh
          bash -n tools/test-release-policy.sh
          bash -n tools/create-dmg.sh
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/release.yml")'
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/packages.yml")'

      - name: Проверка единой версии и release notes
        shell: bash
        run: |
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [[ "$BUNDLE_VERSION" == "$CI_APP_VERSION" ]] || {
            echo "::error::Версия Info.plist $BUNDLE_VERSION не соответствует CI $CI_APP_VERSION." >&2
            exit 1
          }
          grep -Fq "default: \"$CI_APP_VERSION\"" .github/workflows/release.yml || {
            echo "::error::Версия workflow_dispatch не соответствует CI." >&2
            exit 1
          }
          [[ -s "docs/releases/v${CI_APP_VERSION}.md" ]] || {
            echo "::error::Отсутствуют release notes для v$CI_APP_VERSION." >&2
            exit 1
          }

      - name: Security-тесты публикации и Apple notarization
        shell: bash
        run: |
          bash tools/test-release-policy.sh
          python3 tools/test-release-notarization.py

      - name: Модульные тесты
        run: swift test --parallel

      - name: Проверка русскоязычного контракта
        run: ./tools/check-russian-contract.sh

      - name: Release-компиляция
        run: swift build -c release

      - name: Сборка Universal 2
        run: APP_VERSION="$CI_APP_VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./build.sh

      - name: Создание детерминированных снимков
        run: ./tools/snap.sh "$RUNNER_TEMP/RemoteAI-shots"

      - name: Проверка релизного bundle
        run: ./tools/verify-release.sh ".build/app/RemoteAI.app" "$RUNNER_TEMP/RemoteAI-shots" "$CI_APP_VERSION"

      - name: Установка headless DMG layout (dmgbuild 1.6.7)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install \
            --disable-pip-version-check "dmgbuild==1.6.7"
          echo "DMGBUILD_BIN=$RUNNER_TEMP/dmgbuild-venv/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Упаковка CI-кандидата
        shell: bash
        run: |
          ZIP="RemoteAI-${CI_APP_VERSION}-ci-${GITHUB_RUN_NUMBER}-macOS.zip"
          DMG="RemoteAI-${CI_APP_VERSION}-ci-${GITHUB_RUN_NUMBER}-macOS.dmg"
          SHOTS="RemoteAI-${CI_APP_VERSION}-ci-${GITHUB_RUN_NUMBER}-screenshots.zip"

          ditto -c -k --sequesterRsrc --keepParent ".build/app/RemoteAI.app" "$ZIP"
          unzip -t "$ZIP"
          bash ./tools/create-dmg.sh ".build/app/RemoteAI.app" "$DMG" "Remote AI ${CI_APP_VERSION} CI"
          hdiutil verify "$DMG"
          ditto -c -k --keepParent "$RUNNER_TEMP/RemoteAI-shots" "$SHOTS"

          shasum -a 256 "$DMG" "$ZIP" "$SHOTS" > SHA256SUMS.txt
          echo "CI_APP_DMG=$DMG" >> "$GITHUB_ENV"
          echo "CI_APP_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "CI_SHOTS_ZIP=$SHOTS" >> "$GITHUB_ENV"

      - name: Загрузка проверенного артефакта
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAI-${{ env.CI_APP_VERSION }}-${{ github.run_number }}-verified
          path: |
            ${{ env.CI_APP_DMG }}
            ${{ env.CI_APP_ZIP }}
            ${{ env.CI_SHOTS_ZIP }}
            SHA256SUMS.txt
            ${{ runner.temp }}/RemoteAI-shots/*.png
          if-no-files-found: error
          retention-days: 14
