name: Релиз

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия артефакта для тестовой сборки"
        required: true
        default: "0.2.1"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Сборка и публикация
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Определение исходного commit и версии
        shell: bash
        run: |
          git fetch origin main --no-tags

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Релизный тег должен указывать на commit, входящий в main." >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH_TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" =~ ^release/publish-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            PUBLISH_TAG="v$VERSION"
            MAIN_SHA="$(git rev-parse origin/main)"
            if ! git merge-base --is-ancestor "$MAIN_SHA" "$GITHUB_SHA"; then
              echo "Publish-ветка не основана на текущем main. Создайте её заново от актуального main." >&2
              exit 1
            fi
            echo "RELEASE_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
            git checkout --detach "$MAIN_SHA"
            git submodule update --init --recursive
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            PUBLISH_TAG=""
          else
            VERSION="0.2.1-rc.${GITHUB_RUN_NUMBER}"
            PUBLISH_TAG=""
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "PUBLISH_TAG=$PUBLISH_TAG" >> "$GITHUB_ENV"

      - name: Версия toolchain
        run: swift --version

      - name: Модульные тесты
        run: swift test --parallel

      - name: Импорт сертификата Developer ID
        if: env.MACOS_CERTIFICATE_P12 != ''
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/remote-ai-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/remote-ai-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "В переданном сертификате не найдена identity Developer ID Application." >&2
            exit 1
          fi

          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNED_RELEASE=1" >> "$GITHUB_ENV"

      - name: Сборка Universal 2 приложения
        run: APP_VERSION="$APP_VERSION" BUILD_NUMBER="$BUILD_NUMBER" ./build.sh

      - name: Создание релизных снимков
        run: ./tools/snap.sh "$RUNNER_TEMP/RemoteAI-shots"

      - name: Проверка приложения и снимков
        run: ./tools/verify-release.sh ".build/app/RemoteAI.app" "$RUNNER_TEMP/RemoteAI-shots" "$APP_VERSION"

      - name: Упаковка приложения для notarization
        shell: bash
        run: |
          ZIP="RemoteAI-${APP_VERSION}-macOS.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent ".build/app/RemoteAI.app" "$ZIP"
          unzip -t "$ZIP"
          echo "APP_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Notarization и staple
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        shell: bash
        run: |
          xcrun notarytool submit "$APP_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple ".build/app/RemoteAI.app"
          xcrun stapler validate ".build/app/RemoteAI.app"
          spctl --assess --type execute --verbose=4 ".build/app/RemoteAI.app"
          ./tools/verify-release.sh ".build/app/RemoteAI.app" "$RUNNER_TEMP/RemoteAI-shots" "$APP_VERSION"

          rm -f "$APP_ZIP"
          ditto -c -k --sequesterRsrc --keepParent ".build/app/RemoteAI.app" "$APP_ZIP"
          unzip -t "$APP_ZIP"
          echo "NOTARIZED_RELEASE=1" >> "$GITHUB_ENV"

      - name: Упаковка снимков и контрольных сумм
        shell: bash
        run: |
          SCREENSHOTS_ZIP="RemoteAI-${APP_VERSION}-screenshots.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/RemoteAI-shots" "$SCREENSHOTS_ZIP"
          unzip -t "$SCREENSHOTS_ZIP"
          shasum -a 256 "$APP_ZIP" "$SCREENSHOTS_ZIP" > SHA256SUMS.txt
          (cd "$RUNNER_TEMP/RemoteAI-shots" && shasum -a 256 *.png) >> SHA256SUMS.txt
          echo "SCREENSHOTS_ZIP=$SCREENSHOTS_ZIP" >> "$GITHUB_ENV"

      - name: Загрузка проверенного release candidate
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAI-${{ env.APP_VERSION }}-release
          path: |
            ${{ env.APP_ZIP }}
            ${{ env.SCREENSHOTS_ZIP }}
            SHA256SUMS.txt
            ${{ runner.temp }}/RemoteAI-shots/*.png
          if-no-files-found: error
          retention-days: 90

      - name: Создание проверенного релизного тега
        if: startsWith(github.ref, 'refs/heads/release/publish-v')
        shell: bash
        run: |
          TAG="$PUBLISH_TAG"
          MAIN_SHA="$RELEASE_MAIN_SHA"
          REMOTE_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$MAIN_SHA" ]]; then
            echo "Тег $TAG уже существует на $REMOTE_SHA, а проверенный main — $MAIN_SHA." >&2
            exit 1
          fi
          if [[ -z "$REMOTE_SHA" ]]; then
            git tag "$TAG" "$MAIN_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "Проверенный тег: $TAG -> $MAIN_SHA"

      - name: Публикация GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/publish-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$PUBLISH_TAG"
          NOTES_FILE="docs/releases/${TAG}.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Не найден обязательный русскоязычный файл release notes: $NOTES_FILE" >&2
            exit 1
          fi

          EXTRA=()
          if [[ "${NOTARIZED_RELEASE:-0}" != "1" ]]; then
            EXTRA+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Remote AI $TAG" \
              --notes-file "$NOTES_FILE" \
              "${EXTRA[@]}"
            gh release upload "$TAG" \
              "$APP_ZIP" \
              "$SCREENSHOTS_ZIP" \
              SHA256SUMS.txt \
              "$RUNNER_TEMP"/RemoteAI-shots/*.png \
              --clobber
          else
            gh release create "$TAG" \
              "$APP_ZIP" \
              "$SCREENSHOTS_ZIP" \
              SHA256SUMS.txt \
              "$RUNNER_TEMP"/RemoteAI-shots/*.png \
              --title "Remote AI $TAG" \
              --notes-file "$NOTES_FILE" \
              "${EXTRA[@]}"
          fi
