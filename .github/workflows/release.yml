name: Релиз

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия артефакта для тестовой сборки"
        required: true
        default: "0.2.3"

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Сборка и публикация
    runs-on: macos-latest
    env:
      CERT_PRESENT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      CERT_PASSWORD_PRESENT: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      APPLE_ID_PRESENT: ${{ secrets.APPLE_ID != '' }}
      APPLE_TEAM_ID_PRESENT: ${{ secrets.APPLE_TEAM_ID != '' }}
      APPLE_APP_PASSWORD_PRESENT: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Определение исходного commit и версии
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          git fetch origin main --no-tags

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Релизный тег должен указывать на commit, входящий в main." >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH_TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" =~ ^release/publish-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            PUBLISH_TAG="v$VERSION"
            MAIN_SHA="$(git rev-parse origin/main)"
            if ! git merge-base --is-ancestor "$MAIN_SHA" "$GITHUB_SHA"; then
              echo "Publish-ветка не основана на текущем main. Создайте её заново от актуального main." >&2
              exit 1
            fi
            echo "RELEASE_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
            git checkout --detach "$MAIN_SHA"
            git submodule update --init --recursive
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
            PUBLISH_TAG=""
          else
            VERSION="0.2.3-rc.${GITHUB_RUN_NUMBER}"
            PUBLISH_TAG=""
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "PUBLISH_TAG=$PUBLISH_TAG" >> "$GITHUB_ENV"

      - name: Проверка конфигурации подписи и назначения публикации
        shell: bash
        run: |
          RELEASE_SIGNING="$(bash tools/release-policy.sh)"
          echo "RELEASE_SIGNING=$RELEASE_SIGNING" >> "$GITHUB_ENV"
          if [[ "$RELEASE_SIGNING" == "0" ]]; then
            echo "::notice::Dry-run без Apple credentials: ad-hoc candidate, публикация недоступна."
          fi

      - name: Запрет изменения уже опубликованных релизов
        if: env.PUBLISH_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$PUBLISH_TAG" --json tagName >/dev/null 2>&1; then
            echo "::error::Релиз $PUBLISH_TAG уже опубликован. Для новых файлов создайте новый номер версии." >&2
            exit 1
          fi

      - name: Версия toolchain
        run: swift --version

      - name: Security-тесты публикации и Apple notarization
        shell: bash
        run: |
          bash tools/test-release-policy.sh
          python3 tools/test-release-notarization.py

      - name: Модульные тесты
        run: swift test --parallel

      - name: Импорт сертификата Developer ID
        if: env.RELEASE_SIGNING == '1'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/remote-ai-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/remote-ai-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "В переданном сертификате не найдена identity Developer ID Application." >&2
            exit 1
          fi

          if [[ "$IDENTITY" != *"($APPLE_TEAM_ID)" ]]; then
            echo "::error::Developer ID Application не соответствует APPLE_TEAM_ID." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNED_RELEASE=1" >> "$GITHUB_ENV"

      - name: Сборка Universal 2 приложения
        run: APP_VERSION="$APP_VERSION" BUILD_NUMBER="$BUILD_NUMBER" ./build.sh

      - name: Создание релизных снимков
        run: ./tools/snap.sh "$RUNNER_TEMP/RemoteAI-shots"

      - name: Проверка приложения и снимков
        run: ./tools/verify-release.sh ".build/app/RemoteAI.app" "$RUNNER_TEMP/RemoteAI-shots" "$APP_VERSION"

      - name: Упаковка приложения для notarization
        shell: bash
        run: |
          ZIP="RemoteAI-${APP_VERSION}-macOS.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent ".build/app/RemoteAI.app" "$ZIP"
          unzip -t "$ZIP"
          echo "APP_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Notarization приложения и staple
        if: env.RELEASE_SIGNING == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          NOTARY_RESULT="$RUNNER_TEMP/notary-app.json"
          xcrun notarytool submit "$APP_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json > "$NOTARY_RESULT"
          python3 tools/verify-notarization.py "$NOTARY_RESULT"
          xcrun stapler staple ".build/app/RemoteAI.app"
          xcrun stapler validate ".build/app/RemoteAI.app"
          spctl --assess --type execute --verbose=4 ".build/app/RemoteAI.app"
          ./tools/verify-release.sh ".build/app/RemoteAI.app" "$RUNNER_TEMP/RemoteAI-shots" "$APP_VERSION"

          rm -f "$APP_ZIP"
          ditto -c -k --sequesterRsrc --keepParent ".build/app/RemoteAI.app" "$APP_ZIP"
          unzip -t "$APP_ZIP"
          echo "APP_NOTARIZED_RELEASE=1" >> "$GITHUB_ENV"

      - name: Создание DMG
        shell: bash
        run: |
          DMG="RemoteAI-${APP_VERSION}-macOS.dmg"
          bash ./tools/create-dmg.sh ".build/app/RemoteAI.app" "$DMG" "Remote AI ${APP_VERSION}"

          if [[ "${SIGNED_RELEASE:-0}" == "1" ]]; then
            codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "$DMG"
            codesign --verify --verbose=2 "$DMG"
          fi

          hdiutil verify "$DMG"
          echo "DMG_FILE=$DMG" >> "$GITHUB_ENV"

      - name: Notarization DMG и staple
        if: env.RELEASE_SIGNING == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          if [[ "${APP_NOTARIZED_RELEASE:-0}" != "1" ]]; then
            echo "Приложение не прошло notarization перед упаковкой DMG." >&2
            exit 1
          fi

          NOTARY_RESULT="$RUNNER_TEMP/notary-dmg.json"
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json > "$NOTARY_RESULT"
          python3 tools/verify-notarization.py "$NOTARY_RESULT"
          xcrun stapler staple "$DMG_FILE"
          xcrun stapler validate "$DMG_FILE"
          hdiutil verify "$DMG_FILE"
          echo "NOTARIZED_RELEASE=1" >> "$GITHUB_ENV"

      - name: Упаковка снимков и контрольных сумм
        shell: bash
        run: |
          SCREENSHOTS_ZIP="RemoteAI-${APP_VERSION}-screenshots.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/RemoteAI-shots" "$SCREENSHOTS_ZIP"
          unzip -t "$SCREENSHOTS_ZIP"
          shasum -a 256 "$DMG_FILE" "$APP_ZIP" "$SCREENSHOTS_ZIP" > SHA256SUMS.txt
          (cd "$RUNNER_TEMP/RemoteAI-shots" && shasum -a 256 *.png) >> SHA256SUMS.txt
          echo "SCREENSHOTS_ZIP=$SCREENSHOTS_ZIP" >> "$GITHUB_ENV"

      - name: Загрузка проверенного release candidate
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAI-${{ env.APP_VERSION }}-release
          path: |
            ${{ env.DMG_FILE }}
            ${{ env.APP_ZIP }}
            ${{ env.SCREENSHOTS_ZIP }}
            SHA256SUMS.txt
            ${{ runner.temp }}/RemoteAI-shots/*.png
          if-no-files-found: error
          retention-days: 90

      - name: Обязательная проверка подписанного публичного выпуска
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/publish-v')
        shell: bash
        run: |
          [[ "${SIGNED_RELEASE:-0}" == "1" && "${APP_NOTARIZED_RELEASE:-0}" == "1" && "${NOTARIZED_RELEASE:-0}" == "1" ]] || {
            echo "::error::Релиз не подписан и/или не notarized. Публикация запрещена." >&2
            exit 1
          }
          codesign --verify --deep --strict ".build/app/RemoteAI.app"
          codesign --verify --verbose=2 "$DMG_FILE"
          xcrun stapler validate ".build/app/RemoteAI.app"
          xcrun stapler validate "$DMG_FILE"
          spctl --assess --type execute --verbose=4 ".build/app/RemoteAI.app"
          hdiutil verify "$DMG_FILE"

      - name: Создание проверенного релизного тега
        if: startsWith(github.ref, 'refs/heads/release/publish-v')
        shell: bash
        run: |
          TAG="$PUBLISH_TAG"
          MAIN_SHA="$RELEASE_MAIN_SHA"
          REMOTE_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$MAIN_SHA" ]]; then
            echo "Тег $TAG уже существует на $REMOTE_SHA, а проверенный main — $MAIN_SHA." >&2
            exit 1
          fi
          if [[ -z "$REMOTE_SHA" ]]; then
            git tag "$TAG" "$MAIN_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "Проверенный тег: $TAG -> $MAIN_SHA"

      - name: Публикация GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/publish-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$PUBLISH_TAG"
          NOTES_FILE="docs/releases/${TAG}.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Не найден обязательный русскоязычный файл release notes: $NOTES_FILE" >&2
            exit 1
          fi

          gh release create "$TAG" \
            "$DMG_FILE" \
            "$APP_ZIP" \
            "$SCREENSHOTS_ZIP" \
            SHA256SUMS.txt \
            "$RUNNER_TEMP"/RemoteAI-shots/*.png \
            --title "Remote AI $TAG" \
            --notes-file "$NOTES_FILE"

      - name: Очистка временного signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/remote-ai-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/remote-ai-certificate.p12"

  package:
    name: Публикация проверенного DMG в GHCR
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/publish-v')
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/packages.yml
